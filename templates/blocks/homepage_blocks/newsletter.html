<!-- Newsletter Section -->
<section class="py-16 md:py-24 bg-gradient-to-r from-primary to-accent transition-all duration-300">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <h2 class="text-3xl md:text-4xl font-bold text-primary-foreground">Join Our Newsletter</h2>
    <p class="mt-4 text-xl text-primary-foreground/90 max-w-2xl mx-auto">
      Subscribe to receive updates, access to exclusive deals, and more.
    </p>
    
    <div class="mt-8 max-w-md mx-auto">
      <form class="flex flex-col sm:flex-row gap-4">
        <div class="flex-grow">
          <input 
            type="email" 
            placeholder="Enter your email" 
            class="w-full px-5 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-foreground/50 text-foreground"
          >
        </div>
        <button 
          type="submit" 
          class="px-6 py-3 bg-background text-foreground font-medium rounded-lg hover:bg-background/90 transition-colors duration-300 shadow-lg whitespace-nowrap"
        >
          Subscribe
        </button>
      </form>
      <p class="mt-4 text-primary-foreground/80 text-sm">
        We respect your privacy. Unsubscribe at any time.
      </p>
    </div>
  </div>
</section>
