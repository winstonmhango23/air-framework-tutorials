<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxe - Curated Collections</title>
  <meta name="description" content="Discover timeless pieces crafted with precision. Curated collections for the discerning taste.">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="/static/images/icon-light-32x32.png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/static/images/icon-dark-32x32.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/static/images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/images/apple-icon.png">
</head>
<body class="font-sans antialiased min-h-screen bg-background text-foreground">
  {% include "components/header.html" %}
  
  <main class="min-h-screen bg-background text-foreground pt-20">
    {% include "components/hero.html" %}
    {% include "components/categories.html" %}
    {% include "components/product-showcase.html" %}
    {% include "components/newsletter.html" %}
    {% include "components/footer.html" %}
  </main>
  
  <script>
    // Mobile menu toggle functionality
    document.addEventListener('DOMContentLoaded', function() {
      const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
      const mobileMenu = document.getElementById('mobile-menu');
      
      if (mobileMenuToggle && mobileMenu) {
        mobileMenuToggle.addEventListener('click', function() {
          mobileMenu.classList.toggle('hidden');
        });
      }
    });
  </script>
</body>
</html>
